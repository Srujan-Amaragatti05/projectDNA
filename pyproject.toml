[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projectdna"
version = "0.1.0"
description = "Local-first Python project intelligence system"
authors = [{ name = "ProjectDNA Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "watchdog>=3.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dna = "projectdna.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
